# E2: model comparison on UNSW-NB15. d = 20 MI features (the best fixed d in the validation-only
# headroom diagnostic), XGBoost + LightGBM and a QRNN tuned at d = 20. Same split, preprocessing, validation-only model selection and
# test-partition evaluation as E1. Tuned baselines use random search on the same 30k training
# subsample as E1; every final model is fitted on the full training part.
# The summary merges E1 (QRNN at d = 10) and E1b (gradient boosting
# with joint feature selection); paired tests use hgb_hsboa (E1b) as the reference (H1).

experiment: e2_unsw_baselines
dataset: unsw_nb15
seeds_from: configs/data.yaml
n_seeds: 10                       # the same 10 seeds as E1 and E1b (paired)
features: {n_features: 20}        # overrides configs/data.yaml (d = 10) for this experiment only
e1_results: results/e1_unsw_tuners     # tuned QRNN at d = 10 (qrnn_hsboa, qrnn_random) merged into the summary
e1b_results: results/e1b_unsw_gbdt     # gradient boosting arms (hgb_hsboa, hgb_sboa, hgb_random, hgb_default)
reference: hgb_hsboa              # reference model of the paired tests
search:
  train_samples: 30000
  pop_size: 8

models:
  qrnn_untuned:                   # Adam defaults, fixed 200 epochs (same final budget as E1)
    tune: none
    fixed: {units: 16, window: 2, pooling: last, learning_rate: 0.001, batch_size: 256, epochs: 200}

  logreg:
    tune: grid
    space: {log10_C: [-3, 3], class_weight_power: [0, 1]}
    grid: {log10_C: [-3, -2, -1, 0, 1, 2, 3], class_weight_power: [0, 0.5, 1]}

  rf:
    tune: random
    max_evals: 32
    space:
      int_n_estimators: [100, 400]
      int_max_depth: [6, 40]
      int_min_samples_leaf: [1, 10]
      max_features: [0.1, 1.0]
      class_weight_power: [0, 1]

  hgb:
    tune: random
    max_evals: 32
    space:
      log10_learning_rate: [-2.5, -0.5]
      int_max_iter: [100, 400]
      int_max_leaf_nodes: [15, 127]
      int_min_samples_leaf: [5, 100]
      log10_l2_regularization: [-6, 0]
      class_weight_power: [0, 1]

  xgb:                            # needs `pip install xgboost`
    tune: random
    max_evals: 32
    space:
      log10_learning_rate: [-2.5, -0.5]
      int_n_estimators: [100, 400]
      int_max_depth: [3, 12]
      log10_min_child_weight: [-1, 1.5]
      log10_reg_lambda: [-6, 1]
      subsample: [0.5, 1.0]
      colsample_bytree: [0.3, 1.0]
      class_weight_power: [0, 1]

  lgbm:                           # needs `pip install lightgbm`
    tune: random
    max_evals: 32
    space:
      log10_learning_rate: [-2.5, -0.5]
      int_n_estimators: [100, 400]
      int_num_leaves: [15, 127]
      int_min_child_samples: [5, 100]
      log10_reg_lambda: [-6, 1]
      subsample: [0.5, 1.0]
      colsample_bytree: [0.3, 1.0]
      class_weight_power: [0, 1]

  qrnn_random_d20:                # the E1 QRNN search (configs/model.yaml space) at d = 20, random search
    tune: qrnn_hpo
    tuner: random
    model_config: configs/model.yaml
    pop_size: 8
    max_evals: 39                 # E1 budget (39 distinct trainings)
    epochs: 100                   # per trial, as E1
    final_epochs: 200             # as E1

  mlp:                            # same neural budget as E1: 39 distinct trainings, 100 epochs each, 200 final
    tune: random
    max_evals: 39
    fixed: {epochs: 100}
    final_epochs: 200
    space:
      int_layers: [1, 3]
      log2_units: [4, 8]              # 16 .. 256
      dropout: [0.0, 0.5]
      log10_learning_rate: [-4, -2]
      log10_l2: [-7, -3]
      log2_batch_size: [6, 9]
      class_weight_power: [0, 1]

  # CNN-BiLSTM: Conv1D -> MaxPool(2) -> BiLSTM -> Dropout -> softmax, the architecture family of
  # Sinha & Manollas (2020, AIPR, doi:10.1145/3430199.3430224) and Jouhari et al. (2024, arXiv:2407.14945,
  # UNSW-NB15). Neither reports complete layer settings, so the settings are tuned with the same budget
  # as the MLP and the QRNN: 39 distinct trainings, 100 epochs each, 200 final.
  cnn_bilstm:
    tune: random
    max_evals: 39
    fixed: {epochs: 100}
    final_epochs: 200
    space:
      log2_filters: [4, 7]            # 16 .. 128
      int_kernel: [2, 5]
      log2_lstm_units: [4, 7]         # 16 .. 128
      dropout: [0.0, 0.5]
      log10_learning_rate: [-4, -2]
      log2_batch_size: [6, 9]         # 64 .. 512
      class_weight_power: [0, 1]
