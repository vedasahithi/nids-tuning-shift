[project]
name = "hsboa"
version = "1.0.0"
description = "Harmonic secretary bird optimisation for network intrusion detection: controlled evaluation on UNSW-NB15"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "V. Sahiti Yellanki"}, {name = "Basant Sah"}]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
neural = ["tensorflow>=2.16", "keras>=3.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
